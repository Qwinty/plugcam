name: release

# Push a tag like v0.2.0 (same as the version in tauri.conf.json and package.json): builds the
# installer and attaches it to a draft release with the notes from docs/releases/<tag>.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build plugcam_cam.dll (x64, Win32)
        run: ./scripts/vcam-build.ps1

      - name: Tests
        working-directory: src-tauri
        run: cargo test --release

      - name: Installer
        run: |
          ./scripts/stage-resources.ps1 -Download
          pnpm install --frozen-lockfile
          pnpm tauri build

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Out-File -Encoding ascii "$($installer.FullName).sha256"
          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path $notes)) { $notes = $null }
          if (gh release view $tag 2>$null) {
            # Made by hand (publishing a draft creates the tag): keep the files it was tested with.
            Write-Output "Release $tag already exists; leaving its files alone."
          } elseif ($notes) {
            gh release create $tag $installer.FullName "$($installer.FullName).sha256" --draft --title "Plugcam $tag" --notes-file $notes
          } else {
            gh release create $tag $installer.FullName "$($installer.FullName).sha256" --draft --title "Plugcam $tag" --generate-notes
          }
