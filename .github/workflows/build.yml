name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build plugcam_cam.dll (x64, Win32)
        run: ./scripts/vcam-build.ps1

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --release

      - name: Frontend checks
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      # No signing key here: the updater files are only made in the release workflow.
      - name: Installer and portable zip
        run: |
          ./scripts/stage-resources.ps1 -Download
          '{"bundle":{"createUpdaterArtifacts":false}}' | Out-File -Encoding ascii "$env:RUNNER_TEMP/no-updater.json"
          pnpm tauri build --config "$env:RUNNER_TEMP/no-updater.json"
          ./scripts/portable.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: plugcam-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - uses: actions/upload-artifact@v7
        with:
          name: plugcam-portable
          path: src-tauri/target/release/bundle/portable/*.zip
