[package]
name = "plugcam"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "Android phone camera as a Windows webcam"
publish = false

default-run = "plugcam"

[lib]
name = "plugcam"
path = "src/lib.rs"

[[bin]]
name = "plugcam"
path = "src/main.rs"

[dependencies]
env_logger = "0.11.11"
fast_image_resize = "6.1.0"
getrandom = "0.3.4"
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
libloading = "0.8"
log = "0.4.34"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sys-locale = "0.3.2"
tauri = { version = "2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-updater = "2.13.0"
thiserror = "2"
windows = { version = "0.62.2", features = ["Win32_Media_MediaFoundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Registry", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
yuvutils-rs = "0.8.3"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

# `tauri dev` builds the dev profile. Unoptimized color conversion and scaling take ~190 ms a
# frame there (5 fps, and the phone starts dropping frames), so optimize even in dev.
[profile.dev]
opt-level = 1
# Incremental builds of optimized code can fail to link (missing `anon.*.llvm` symbols).
incremental = false

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.plugcam]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

# Local test builds of the whole app: `pnpm tauri build --no-bundle -- --profile release-fast`.
# Same speed of the app within a few percent, but code generation runs on every core and there
# is no link-time optimization, which is what makes `release` take minutes.
[profile.release-fast]
inherits = "release"
codegen-units = 16
lto = false
incremental = true
